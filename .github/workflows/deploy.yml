name: Build and Deploy NearNest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Type check
        run: |
          pnpm --filter @neighbourhub/shared type-check || true
          pnpm --filter web type-check || npx --prefix apps/web tsc --noEmit
          pnpm --filter server type-check || npx --prefix apps/server tsc --noEmit

      - name: Build Web Application
        run: pnpm --filter web build
